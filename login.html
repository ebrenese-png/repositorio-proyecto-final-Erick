<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Gestión de Egresados</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="css/estilos.css">
    
</head>

<body>

    <header>

        <div class="logo">
            <h1>Universidad CENFOTEC</h1>
            <img src="imagen cenfotec.jpg" width="20%" height="30%" alt="Logo de la Universidad CENFOTEC" class="logo">
            <h3>Sistema de Gestión de Egresados</h3>
        </div>

        <nav>
            <ul>
                <li><a href="inicio.html">Inicio</a></li>
                <li><a href="login.html">Iniciar Sesión</a></li>
                <li><a href="perfil.html">Perfil</a></li>
                <li><a href="egresados.html">Registrar Egresado</a></li>
                <li><a href="carreras.html">Carreras</a></li>
            </ul>
        </nav>

    </header>

    <main>

        <section class="formulario">

            <h2>Inicio de Sesión</h2>

            <form action="#">

                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="Ingrese su correo" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>

                <label for="rol">Rol</label>
                <select id="rol" name="rol">

                    <option value="">Seleccione un rol</option>
                    <option>Registro</option>
                    <option>Bienestar Estudiantil</option>
                    <option>Egresado</option>

                </select>

                <button type="submit">Iniciar Sesión</button>

            </form>

        </section>

    </main>

    <footer>

        <p>
            Proyecto Final | Desarrollo de Aplicaciones Web |
            Universidad CENFOTEC © 2026
        </p>

    </footer>

</body>

</html>
